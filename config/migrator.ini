# mini-migrator 配置（示例）
[source]
mode = sim
# mysql 时填写：host=127.0.0.1 port=3306 user=root password=*** db=demo

[target]
mode = sim
# postgres 时填写：host=127.0.0.1 port=5432 user=postgres password=*** db=demo

[migration]
batch_size = 1000
commit_every = 10
type_map = config/type_map.json
verify = true

[web]
port = 8123
